<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routineify - Calendar Habit Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard">
        <div class="card">
            <h2>Habits</h2>
            <div class="input-section">
                <input type="text" id="habit-input" placeholder="New habit..." maxlength="30">
                <button id="add-btn">Add</button>
            </div>
            <ul id="habit-list" class="habit-list"></ul>
        </div>

        <div class="card">
            <div class="calendar-header">
                <h2 id="calendar-month-year">Month Year</h2>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <script src="js/habbit.js"></script>
</body>
</html>
